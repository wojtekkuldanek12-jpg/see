<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ćwiczenia z lukami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#7758e8;--pink:#ff6b9d;--green:#20b486;--bg:#f6f4ff;--card:#fff;--ink:#302d4a;--mut:#8b86a4;--line:#ebe7fb;--soft:#f4f0ff;--ok-bg:#e5fff5;--ok:#087c5a;--bad-bg:#fff0f4;--bad:#ce4264;--field:#faf9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17152a;--card:#221f3a;--ink:#ece9ff;--mut:#9d98bd;--line:#35315a;--soft:#2c2850;--ok-bg:#12382e;--ok:#5fe0b6;--bad-bg:#402032;--bad:#ff8fa8;--field:#1c1932}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:24px 14px;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.wrap{max-width:1000px;margin:auto}
.hero{text-align:center;padding:24px 18px;border-radius:26px;color:#fff;background:linear-gradient(120deg,#7857e8,#b06af4,#ff78ad)}
.hero h1{margin:4px 0;font-size:clamp(22px,5vw,34px);font-weight:800}.hero p{margin:6px 0 0;opacity:.95;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:18px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.side .card,.main .card{margin-top:0}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;border:2px solid transparent}
.item:hover{background:var(--soft)}.item.on{background:var(--soft);border-color:var(--purple);color:var(--purple)}
.item small{color:var(--mut);font-weight:500}
input[type=text],textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:500 14px 'Poppins',sans-serif;outline:none}
input:focus,textarea:focus{border-color:var(--purple)}
textarea{min-height:200px;resize:vertical;line-height:1.7}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin:12px 0 5px}
.btn{border:none;border-radius:12px;padding:10px 16px;font:700 13px 'Poppins',sans-serif;cursor:pointer;background:var(--soft);color:var(--purple)}
.btn:hover{transform:translateY(-1px)}
.btn.p{color:#fff;background:linear-gradient(100deg,#7858e8,#a16aef)}.btn.g{color:#fff;background:linear-gradient(100deg,#20b486,#3fd0a2)}.btn.d{color:var(--bad);background:var(--bad-bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600;margin:3px}
.gaprow{display:flex;gap:8px;align-items:center;margin:6px 0}.gaprow b{min-width:58px;font-size:12px;color:var(--purple)}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.big{border:3px solid var(--purple);background:linear-gradient(120deg,var(--soft),var(--card))}.pol{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}.polt{font-size:clamp(18px,3.4vw,24px);font-weight:800;line-height:1.4;margin-top:4px}
.dt{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px}.dt summary{cursor:pointer;font-weight:700;font-size:14px}
.dz{border:2px dashed var(--purple);border-radius:14px;padding:14px;text-align:center;font-size:13px;font-weight:600;color:var(--mut);margin-top:8px}.dz.on{background:var(--soft)}
.emo{display:inline-block;border:none;background:var(--soft);border-radius:10px;font-size:36px;padding:2px 8px;margin:3px;cursor:pointer;line-height:1.3}.emo:hover{transform:scale(1.15)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;background:var(--soft);color:var(--purple)}.tab.on{background:var(--purple);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px}
.sc{font-weight:800}.sc.hi{color:var(--ok)}.sc.lo{color:var(--bad)}
.tablewrap{overflow-x:auto}
.story{font-size:15px;line-height:2.7;flex:1;min-width:0}
.lay.has{display:flex;gap:20px;align-items:flex-start}
.pics{flex:0 0 36%;position:sticky;top:12px}
.pics img{display:block;width:100%;border-radius:14px;margin-bottom:12px;border:1px solid var(--line)}
@media(max-width:720px){.lay.has{flex-direction:column}.pics{order:-1;flex:none;width:100%;position:static}}
.blank{width:140px;max-width:100%;padding:6px 9px;margin:3px;border:2px solid var(--line);border-radius:10px;background:var(--field);color:var(--purple);font:600 14px 'Poppins',sans-serif;outline:none;display:inline-block}
.blank:focus{border-color:var(--purple)}.blank.correct{border-color:var(--green);background:var(--ok-bg);color:var(--ok)}.blank.wrong{border-color:#ff7190;background:var(--bad-bg);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:9px}.word{border:2px solid var(--line);background:var(--soft);color:var(--purple);border-radius:12px;padding:8px 12px;font:700 13px 'Poppins',sans-serif;cursor:pointer}.word.used{opacity:.35;text-decoration:line-through}
.inst{padding:12px 14px;border-radius:14px;background:var(--soft);font-weight:600;font-size:14px;line-height:1.6;margin-bottom:14px}
.bar{background:var(--line);height:9px;border-radius:99px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7758e8,#ff75ae);transition:width .3s}
.res{display:none;margin-top:16px;padding:16px;border-radius:14px;background:var(--soft);font-weight:600;line-height:1.8}
.code{width:100%;font-size:11px;min-height:60px;margin-top:6px}
.msg{font-size:12px;font-weight:600;color:var(--green);margin-left:6px}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
/* HALLOWEEN */
.wrap,.ground{position:relative;z-index:1}.hero{position:relative}
:root:not(.plain):not([data-theme="light"]){color-scheme:dark;--bg:#160d2b;--card:#241540;--ink:#fff1de;--mut:#c3a9e8;--line:#4b2f7a;--soft:#34205c;--purple:#ff8a1f;--pink:#b86bff;--green:#3ddc97;--ok-bg:#123b2e;--ok:#6ff0b8;--bad-bg:#47203a;--bad:#ff8fa8;--field:#1b1033}
html:not(.plain) body{background:radial-gradient(circle at 12% 0%,#6b2bb066,transparent 45%),radial-gradient(circle at 92% 100%,#ff7a0040,transparent 42%),#160d2b}
html:not(.plain) .hero{background:linear-gradient(120deg,#ff7a00,#d4470a 45%,#5b21b6);box-shadow:0 10px 30px #ff7a0040}
html:not(.plain) .btn.p{background:linear-gradient(100deg,#ff7a00,#ff4d2e);color:#fff}
html:not(.plain) .bar i{background:linear-gradient(90deg,#ff8a1f,#b86bff)}
html:not(.plain) .card{border-color:#5a3a92;position:relative}
html:not(.plain) .card:nth-of-type(3n+1)::before{content:"";position:absolute;top:0;right:52px;width:2px;height:30px;background:#cdbbf0aa;pointer-events:none}
html:not(.plain) .card:nth-of-type(3n+1)::after{content:"🕷️";position:absolute;top:26px;right:41px;font-size:24px;pointer-events:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.spd{position:absolute;top:100%;margin-top:-1px;transform-origin:top center;animation:sw 3s ease-in-out infinite alternate;z-index:2;pointer-events:none}
.spd i{display:block;width:2px;height:var(--h);background:#e5d9ff;margin:0 auto}.spd b{display:block;font-size:28px;margin-top:-6px;line-height:1}
@keyframes sw{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.hl,.hr{position:absolute;bottom:6px;font-size:clamp(34px,7vw,64px);line-height:1;animation:fl 3s ease-in-out infinite}.hl{left:2.5%}.hr{right:2.5%;animation-delay:-1.5s}
@media(max-width:560px){.hl,.hr{display:none}}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx .fl{position:absolute;opacity:.55;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(6deg)}}
.fx .bat{position:absolute;left:0;font-size:28px;z-index:2;animation:fly linear infinite;opacity:.9}
@keyframes fly{from{transform:translateX(-12vw) translateY(0)}50%{transform:translateX(50vw) translateY(-26px)}to{transform:translateX(112vw) translateY(0)}}
.ground{text-align:center;font-size:clamp(26px,5vw,40px);margin-top:34px;padding-bottom:16px}
.ground span{display:inline-block;margin:0 clamp(2px,1vw,10px);animation:jump 2.2s ease-in-out infinite}
@keyframes jump{0%,70%,100%{transform:translateY(0)}85%{transform:translateY(-12px)}}
.tg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;font-size:18px;padding:8px 12px}
html.plain .spd,html.plain .hl,html.plain .hr,html.plain .fx,html.plain .ground{display:none}
.em{font-size:1.9em;line-height:1;vertical-align:-.12em;display:inline-block}
.word.x{opacity:.35;text-decoration:line-through}
.qh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip2{background:var(--soft);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px}
.qbar{height:10px;border-radius:99px;background:var(--line);margin:12px 0 26px;overflow:hidden}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a1f,#b86bff);transition:width .5s}
.qcard{position:relative;background:linear-gradient(160deg,var(--card),var(--soft));border:2px solid var(--line);border-radius:26px;padding:22px 18px 26px;box-shadow:0 16px 40px #0006;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.95)}}
.qtimer{position:absolute;right:14px;top:-24px;width:64px;height:64px;filter:drop-shadow(0 0 10px #ff8a1f88)}
.qtimer svg{width:100%;height:100%;transform:rotate(-90deg)}.qtimer circle{fill:var(--card);stroke-width:4}.qtimer .tr{stroke:var(--line)}.qtimer .tp{stroke:#ff8a1f;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:0;transition:stroke .3s}
.qtimer b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.qtimer.low .tp{stroke:#ff4d6d}.qtimer.low{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.qtxt{font-size:clamp(20px,4.2vw,30px);font-weight:800;line-height:1.35;margin:14px 70px 14px 0}
.qimg{display:block;max-width:100%;max-height:300px;margin:6px auto 14px;border-radius:18px;border:2px solid var(--line);animation:pop .5s}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}@media(max-width:600px){.qopts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border:none;border-radius:18px;color:#fff;font:700 clamp(15px,3.4vw,19px) 'Poppins',sans-serif;cursor:pointer;transition:transform .18s,filter .2s;box-shadow:0 6px 0 #0004;animation:pop .5s backwards}
.opt:nth-child(1){background:linear-gradient(135deg,#ff8a1f,#ff5a1f);animation-delay:.05s}.opt:nth-child(2){background:linear-gradient(135deg,#8b5cf6,#6d28d9);animation-delay:.12s}.opt:nth-child(3){background:linear-gradient(135deg,#10b981,#047857);animation-delay:.19s}.opt:nth-child(4){background:linear-gradient(135deg,#ec4899,#be185d);animation-delay:.26s}.opt:nth-child(n+5){background:linear-gradient(135deg,#0ea5e9,#0369a1)}
.opt:hover{transform:translateY(-3px) scale(1.02);filter:brightness(1.1)}.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
.opt .ol{flex:none;width:38px;height:38px;border-radius:12px;background:#0003;display:grid;place-items:center;font-size:20px}
.opt img{max-height:100px;max-width:100%;border-radius:12px;margin-top:6px}
.opt.sel{outline:4px solid #fff;transform:scale(1.03)}
.opt.good{background:linear-gradient(135deg,#22c55e,#15803d)!important;outline:4px solid #bbf7d0;animation:glow .8s ease-out}
.opt.bad{background:linear-gradient(135deg,#ef4444,#991b1b)!important;animation:shake .5s}
.opt.dim{opacity:.4;filter:grayscale(.5)}.opt:disabled{cursor:default}.opt:disabled:hover{transform:none}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes glow{from{box-shadow:0 0 0 0 #4ade80}to{box-shadow:0 0 0 24px #4ade8000}}
.oin{width:100%;padding:16px;border-radius:16px;border:3px solid var(--line);background:var(--field);color:var(--ink);font:700 20px 'Poppins',sans-serif;outline:none;text-align:center;margin-bottom:12px}.oin:focus{border-color:#ff8a1f;box-shadow:0 0 0 5px #ff8a1f33}
.fbk{margin-top:16px;padding:14px 16px;border-radius:16px;font-weight:700;line-height:1.6;animation:pop .4s}.fbk.ok{background:var(--ok-bg);color:var(--ok)}.fbk.no{background:var(--bad-bg);color:var(--bad)}
.pts{display:inline-block;font-size:1.4em;font-weight:800;animation:pop .6s}
.cf{position:fixed;top:-50px;z-index:60;pointer-events:none;animation:cfall var(--d) ease-in forwards}@keyframes cfall{to{transform:translate(var(--x),112vh) rotate(540deg)}}
.sbig{font-size:clamp(54px,15vw,100px);font-weight:800;line-height:1.1;background:linear-gradient(90deg,#ff8a1f,#ffd166,#b86bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rv.me{outline:2px solid #ff8a1f;background:linear-gradient(90deg,#ff8a1f33,var(--soft))}
.rv{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);margin:6px 0;font-size:14px;font-weight:600;animation:pop .4s backwards}

</style>
</head>
<body>
<div class="fx" id="fx"></div><div class="wrap" id="app"></div><div class="ground" id="gr"></div><button class="btn tg" id="tg" title="Motyw Halloween: włącz lub wyłącz">🎃</button>
<script>
(function(){
const $=s=>document.querySelector(s);
const app=$("#app");

const shrink=(f,max,q)=>new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok({blob:()=>new Promise(r=>c.toBlob(r,'image/jpeg',q)),url:()=>{const w=c.toDataURL('image/webp',q);return w.startsWith('data:image/webp')?w:c.toDataURL('image/jpeg',q)}})};im.src=fr.result};fr.readAsDataURL(f)});
const cap=n=>{try{return window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
const autoBank=e=>[...gaps(e.text).map(a=>a.split("|")[0].trim()),...(e.extra||"").split(",").map(s=>s.trim()).filter(Boolean)].join(", ");
const EMO=["⚽","🏀","🎾","🏆","🇵🇱","🇬🇧","🇺🇸","🇫🇷","🇩🇪","🇪🇸","🇮🇹","🇸🇦","🇯🇵","🇧🇷","🍎","🍕","🍔","☕","🎵","🎬","📚","💻","📱","🚗","✈️","🏠","🌍","🌞","🌧️","❄️","🔥","💰","❤️","⭐","😀","😂","😁","😢","😱","👍","👏","🎉","🐶","🐱","🦁","🌳","⏰","🔒","🕵️","🛒","🥛","🧀","🍦","🥩"];
const EKEY={ball:"⚽",football:"⚽",soccer:"⚽",basketball:"🏀",tennis:"🎾",trophy:"🏆",poland:"🇵🇱",polish:"🇵🇱",england:"🇬🇧",britain:"🇬🇧",usa:"🇺🇸",america:"🇺🇸",france:"🇫🇷",french:"🇫🇷",germany:"🇩🇪",spain:"🇪🇸",italy:"🇮🇹",saudi:"🇸🇦",japan:"🇯🇵",brazil:"🇧🇷",fire:"🔥",money:"💰",computer:"💻",hacker:"💻",phone:"📱",music:"🎵",film:"🎬",movie:"🎬",book:"📚",car:"🚗",plane:"✈️",house:"🏠",food:"🍕",pizza:"🍕",coffee:"☕",milk:"🥛",cheese:"🧀","ice cream":"🍦",meat:"🥩",supermarket:"🛒",shop:"🛒",dog:"🐶",cat:"🐱",lion:"🦁",sun:"🌞",rain:"🌧️",snow:"❄️",love:"❤️",star:"⭐",time:"⏰",police:"🕵️"};

function student(ex){if(ex.k==="q")return quiz(ex);
  const bankWords=[];
  const parts=[];let last=0,n=0;
  ex.x.replace(GAP,(m,a,i)=>{parts.push(big(esc(ex.x.slice(last,i))).replace(/\n/g,"<br>"));
    const ans=a.split("|").map(s=>s.trim()).filter(Boolean);bankWords.push(ans[0]);
    parts.push(`<input class="blank" data-a="${esc(ans.join("|"))}" aria-label="Luka ${++n}" autocomplete="off" autocapitalize="off" spellcheck="false">`);last=i+m.length;return m});
  parts.push(big(esc(ex.x.slice(last))).replace(/\n/g,"<br>"));
  const words=ex.b?(ex.bw!=null?ex.bw.split(","):[...bankWords,...(ex.e||"").split(",")]).map(s=>s.trim()).filter(Boolean).sort(()=>Math.random()-.5):[];
  app.innerHTML=hdr(esc(ex.t||"Ćwiczenie"),"Uzupełnij luki i kliknij „Sprawdź”. Masz tylko jedną próbę!")+
  (ex.n?`<section class="card big"><div class="pol">📌 Polecenie</div><div class="polt">${esc(ex.n)}</div></section>`:"")+
  (words.length?`<section class="card"><h2>🎨 Bank słów</h2><div class="bank" id="bank"></div><div class="row"><button class="btn" id="stk" type="button">✏️ Skreślanie słów: wyłączone</button></div><div class="hint">Kliknij słowo, a potem lukę, albo wpisz odpowiedź ręcznie. Włącz skreślanie, żeby ręcznie zaznaczać słowa, które już zrobiłeś (na komputerze działa też prawy przycisk myszy).</div></section>`:"")+
  `<section class="card">
  <label style="margin-top:0">Twoje imię i nazwisko</label><input type="text" id="sname" placeholder="np. Anna Kowalska" style="max-width:320px;margin-bottom:14px">
  <div class="lay${(ex.im||[]).length?" has":""}"><div class="story">${parts.join("")}</div>${(ex.im||[]).length?`<div class="pics">${(ex.im||[]).map(u=>`<img src="${esc(u)}" alt="">`).join("")}</div>`:""}</div><div class="bar"><i id="bar"></i></div>
  <div class="row"><button class="btn p" id="chk">✅ Sprawdź (tylko raz)</button></div>
  <div class="res" id="res"></div></section>`;
  const blanks=[...document.querySelectorAll(".blank")];let sel=null,lastIn=null;let saved=null;if(!ex.p){try{saved=JSON.parse(localStorage.getItem("luki_done_"+ex.i))}catch(e){}}
  const bank=$("#bank");let strike=false;const sb=$("#stk");if(sb)sb.onclick=()=>{strike=!strike;sb.textContent="✏️ Skreślanie słów: "+(strike?"włączone, klikaj słowa":"wyłączone");sb.style.background=strike?"var(--purple)":"";sb.style.color=strike?"#fff":""};
  const upd=()=>{const u=new Set(blanks.map(b=>norm(b.value)));document.querySelectorAll(".word").forEach(w=>w.classList.toggle("used",u.has(norm(w.textContent))))};
  words.forEach(w=>{const b=document.createElement("button");b.className="word";b.type="button";b.textContent=w;
    b.oncontextmenu=ev=>{ev.preventDefault();b.classList.toggle("x")};b.onclick=()=>{if(strike){b.classList.toggle("x");return}const t=document.activeElement.classList&&document.activeElement.classList.contains("blank")?document.activeElement:(lastIn&&!lastIn.value?lastIn:blanks.find(x=>!x.value));
      if(t){t.value=w;t.classList.remove("correct","wrong");t.focus();upd()}};bank.appendChild(b)});
  blanks.forEach(b=>{b.addEventListener("focus",()=>lastIn=b);b.addEventListener("input",()=>{b.classList.remove("correct","wrong");upd()});
    b.addEventListener("click",()=>{if(sel&&!b.value){}})});
  $("#chk").onclick=()=>{
    const name=$("#sname").value.trim();
    if(!name){$("#sname").focus();$("#sname").style.borderColor="#ff7190";return}
    if(!saved&&!ex.p&&!confirm("Możesz sprawdzić odpowiedzi tylko jeden raz. Czy na pewno chcesz sprawdzić?"))return;
    let ok=0;const det=[];blanks.forEach(b=>{const good=b.dataset.a.split("|").map(norm).includes(norm(b.value));b.classList.remove("correct","wrong");b.classList.add(good?"correct":"wrong");det.push([b.value,good?1:0]);if(good)ok++});
    const t=blanks.length;$("#bar").style.width=(t?ok/t*100:0)+"%";
    const code=saved?saved.code:enc({i:ex.i,n:name,c:ok,t:t,d:new Date().toISOString(),a:det});
    if(ex.fb&&!saved&&!ex.p){fbReq(ex.fb,"/res/"+ex.i,"POST",{n:name,c:ok,t:t,d:new Date().toISOString(),a:det}).then(()=>{const s=$("#sent");if(s)s.textContent="✔ Wynik został wysłany do nauczyciela automatycznie."},()=>{const s=$("#sent");if(s){s.style.color="var(--bad)";s.textContent="Nie udało się wysłać wyniku automatycznie. Skopiuj kod poniżej i wyślij go nauczycielowi."}})}
    if(!ex.p){blanks.forEach(b=>b.readOnly=true);document.querySelectorAll(".word").forEach(w=>w.disabled=true);$("#sname").readOnly=true;$("#chk").style.display="none";
      try{localStorage.setItem("luki_done_"+ex.i,JSON.stringify({code:code,ans:blanks.map(b=>b.value),name:name}))}catch(e){}}
    const r=$("#res");r.style.display="block";
    r.innerHTML=`${ok===t?"🏆 Perfekcyjnie!":"⭐ Twój wynik:"} <span style="color:var(--ok)">✔ ${ok} dobrze</span> · <span style="color:var(--bad)">✘ ${t-ok} źle</span> (${ok}/${t})
    <div class="hint">Zielone luki są poprawne, czerwone błędne. To była jedyna próba. Skopiuj kod wyniku i wyślij go nauczycielowi:</div>
    <div id="sent" class="msg" style="display:block;margin:8px 0 0">${ex.fb&&!ex.p?"Wysyłam wynik do nauczyciela…":""}</div><textarea class="code" readonly onclick="this.select()">${code}</textarea>
    <div class="row"><button class="btn g" id="cp">📋 Kopiuj kod wyniku</button><span class="msg" id="cm"></span></div>`;
    $("#cp").onclick=()=>{const ta=r.querySelector("textarea");ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand("copy")}$("#cm").textContent="Skopiowano!"};
  };
  if(saved){$("#sname").value=saved.name;blanks.forEach((b,i)=>b.value=saved.ans[i]||"");upd();$("#chk").onclick()}
}

let S={folders:[],ex:[],res:[]},curF="all",curE=null,tab="edit",dbDoc=null,note="",openD={};
async function load(){
  try{const u=await cap("db");if(u)dbDoc=u.doc("app/state")}catch(e){}
  try{if(dbDoc){const s=await dbDoc.get();if(s.exists){S=Object.assign(S,s.data());return}}}catch(e){}
  try{const l=localStorage.getItem("luki_state");if(l)S=Object.assign(S,JSON.parse(l))}catch(e){}
}
let tmr;function save(){clearTimeout(tmr);tmr=setTimeout(async()=>{
  try{if(dbDoc)await dbDoc.set(JSON.parse(JSON.stringify(S)))}catch(e){}
  try{localStorage.setItem("luki_state",JSON.stringify(S))}catch(e){}},400)}
const b64u=u=>{let s="";u.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const pipe=async(u,C)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new C("deflate-raw"))).arrayBuffer());
const encz=async o=>{try{return "~"+b64u(await pipe(new TextEncoder().encode(JSON.stringify(o)),CompressionStream))}catch(e){return enc(o)}};
const decz=async s=>s[0]==="~"?JSON.parse(new TextDecoder().decode(await pipe(unb(s.slice(1)),DecompressionStream))):dec(s);
const small=u=>new Promise(r=>{if(!u.startsWith("data:")||u.length<9000)return r(u);const im=new Image();im.onerror=()=>r(u);im.onload=()=>{const k=Math.min(1,420/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let o=c.toDataURL("image/webp",.4);if(!o.startsWith("data:image/webp"))o=c.toDataURL("image/jpeg",.4);r(o.length<u.length?o:u)};im.src=u});
let fbErr="";
const fbHost=h=>String(h||"").trim().replace(/^https?:\/\//,"").replace(/\/.*$/,"");
async function fbReq(host,path,method,body){const ac=new AbortController();const to=setTimeout(()=>ac.abort(),9000);try{const r=await fetch("https://"+host+path+".json",{method,headers:body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined,signal:ac.signal});if(!r.ok)throw new Error("błąd "+r.status);return await r.json()}finally{clearTimeout(to)}}
async function link(e){const base=location.href.split("#")[0];const mk=im=>{if(e.kind==="quiz")return qObj(e);const o={i:e.id,t:e.title,n:e.inst,x:e.text,b:e.bank};if(e.bw!=null)o.bw=e.bw;else if(e.extra)o.e=e.extra;if(im.length)o.im=im;return o};
  const inl=base+"#u="+await encz(mk(await Promise.all((e.images||[]).map(small))));
  fbErr="";const h=fbHost(S.fb);if(!h)return inl;
  try{const id=uid()+uid();await fbReq(h,"/ex/"+id,"PUT",mk(e.images||[]));return base+"#k="+h+"/"+id}catch(x){fbErr=String((x&&x.message)||x)}
  return inl}

    ${ex.fb&&!ex.p?'<section class="card"><h2>🏆 Ranking</h2><div id="lbx"></div><div class="row"><button class="btn" id="lbr">↻ Odśwież ranking</button></div></section>':''}${code?`<section class="card"><div class="hint" style="margin:0">Kod wyniku (zapasowy, gdyby wynik nie dotarł sam):</div><textarea class="code" readonly onclick="this.select()">${code}</textarea></section>`:''}${ex.p?'<div class="row"><button class="btn p" id="again">↺ Zagraj jeszcze raz</button></div>':''}`;
    cnt_($('#fs'),0,sc);if(ex.fb&&!ex.p){$('#lbr').onclick=()=>lb(nm);lb(nm)}sfx('end');boom(['🎃','👻','🦇','⭐','🕷️','💀'],pc>=50?46:16);const ag=$('#again');if(ag)ag.onclick=()=>{score=0;log=[];intro()}}
  function finish(){const code=enc({i:ex.i,n:name,c:score,t:max,d:new Date().toISOString(),a:log});let msg='';
    if(!ex.p){try{localStorage.setItem('luki_done_'+ex.i,JSON.stringify({q:1,name:name,score:score,log:log,code:code}))}catch(e){}
      if(ex.fb){msg='Wysyłam wynik do nauczyciela…';const mark=(t,bad)=>{const s=$('#sent');if(s){s.textContent=t;if(bad)s.style.color='var(--bad)'}};
        fbReq(ex.fb,'/res/'+ex.i,'POST',{n:name,c:score,t:max,d:new Date().toISOString(),a:log}).then(()=>{mark('✔ Wynik został wysłany do nauczyciela.');lb(name)},()=>mark('Nie udało się wysłać wyniku automatycznie. Skopiuj kod poniżej i wyślij go nauczycielowi.',1))}}
    end(name,score,log,code,msg)}
  if(saved&&saved.q)end(saved.name,saved.score,saved.log||[],saved.code,'Ten quiz został już rozwiązany. Oto twój wynik.');else intro();
}

async function init(){
  const m=location.hash.match(/^#u=(.+)$/);
  const bm=location.hash.match(/^#k=([\w.-]+)\/([\w-]+)$/);
  if(bm){app.innerHTML=hdr("Ładowanie…","Chwileczkę");
    try{const o=await fbReq(bm[1],"/ex/"+bm[2],"GET");if(!o)throw 0;o.fb=bm[1];student(o);return}
    catch(e){app.innerHTML=hdr("Ups","Nie udało się wczytać ćwiczenia")+`<div class="card">Sprawdź internet i spróbuj ponownie. Jeśli to nie pomoże, poproś nauczyciela o nowy link.</div>`;return}}
  if(m){try{student(await decz(m[1]));return}catch(e){app.innerHTML=hdr("Ups","Ten link jest uszkodzony")+`<div class="card">Poproś nauczyciela o nowy link.</div>`;return}}
  let owner=true;
  try{const u=await cap("user");if(u)owner=await u.isOwner()}catch(e){}
  if(!owner){app.innerHTML=hdr("Ćwiczenia z lukami","Otwórz link otrzymany od nauczyciela")+`<div class="card">Ta strona to panel nauczyciela. Uczeń otwiera ćwiczenie przez swój link.</div>`;return}
  await load();teacher();
}

  const fx=$("#fx");[["🎃",2,12,44],["👻",92,16,40],["🧙",90,44,46],["💀",3,64,40],["🕸️",0,0,70],["🕸️",93,0,70],["🎃",92,72,46],["🍬",6,88,30],["🧛",86,88,42],["🕯️",2,40,30],["🧟",94,58,40],["👻",8,26,34],["🌕",80,4,46],["🦉",96,30,34],["🦴",5,78,30]].forEach((a,i)=>{const s=document.createElement("span");s.className="fl";s.textContent=a[0];s.style.cssText=`left:${a[1]}%;top:${a[2]}%;font-size:${a[3]}px;animation-delay:-${(i*.7)%4}s;animation-duration:${3.5+(i%3)}s`;fx.appendChild(s)});
  [[12,17],[30,22],[22,26]].forEach((a,i)=>{const s=document.createElement("span");s.className="bat";s.textContent="🦇";s.style.cssText=`top:${a[0]}vh;animation-duration:${a[1]}s;animation-delay:-${i*7}s`;fx.appendChild(s)});
  $("#gr").innerHTML=["🪦","🎃","💀","🧟","🧙","🎃","👻","🦇","🕯️","🧛","🎃","🪦"].map((m,i)=>`<span style="animation-delay:${i*.25}s">${m}</span>`).join("")})();
init();
})();
